  <g transform="translate(160 160)" fill="none" stroke-width="34" stroke-dasharray="14.7 250" stroke-linecap="butt">
    <circle r="108" pathLength="250" stroke="#e5243b" transform="rotate(-90)"/>
    <circle r="108" pathLength="250" stroke="#dda63a" transform="rotate(-68.8)"/>
    <circle r="108" pathLength="250" stroke="#4c9f38" transform="rotate(-47.6)"/>
    <circle r="108" pathLength="250" stroke="#c5192d" transform="rotate(-26.5)"/>
    <circle r="108" pathLength="250" stroke="#ff3a21" transform="rotate(-5.3)"/>
    <circle r="108" pathLength="250" stroke="#26bde2" transform="rotate(15.9)"/>
    <circle r="108" pathLength="250" stroke="#fcc30b" transform="rotate(37.1)"/>
    <circle r="108" pathLength="250" stroke="#a21942" transform="rotate(58.2)"/>
    <circle r="108" pathLength="250" stroke="#fd6925" transform="rotate(79.4)"/>
