  <circle cx="160" cy="160" r="72" fill="#ffffff"/>
  <text x="160" y="151" text-anchor="middle" fill="#16384d" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="900">SDGs</text>
  <text x="160" y="180" text-anchor="middle" fill="#0f6f5f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">2030</text>
